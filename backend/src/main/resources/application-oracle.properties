# Activate with: SPRING_PROFILES_ACTIVE=oracle mvn spring-boot:run
# Requires these environment variables to be set first:
#   TNS_NAME=astrodb_tp            (from the Database Connection page)
#   WALLET_DIR=/path/to/unzipped/wallet
#   DATABASE_USERNAME=ASTRO_APP    (see README - do NOT use ADMIN in the app)
#   DATABASE_PASSWORD=your-app-user-password

spring.datasource.url=jdbc:oracle:thin:@${TNS_NAME}?TNS_ADMIN=${WALLET_DIR}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.type=oracle.ucp.jdbc.PoolDataSourceImpl
spring.datasource.oracleucp.connection-factory-class-name=oracle.jdbc.pool.OracleDataSource
spring.datasource.oracleucp.connection-pool-name=AstroPool
spring.datasource.oracleucp.initial-pool-size=2
spring.datasource.oracleucp.min-pool-size=1
spring.datasource.oracleucp.max-pool-size=10
spring.datasource.oracleucp.shared=true

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# 'update' keeps existing data between restarts (unlike H2's create-drop).
spring.jpa.hibernate.ddl-auto=update

# Do NOT re-run data.sql automatically here - unlike H2, Oracle data persists between
# restarts, so re-running it every time would insert duplicate services/reviews.
# See README for how to seed data.sql just once via the Oracle SQL worksheet.
spring.sql.init.mode=never
